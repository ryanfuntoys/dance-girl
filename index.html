<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NON-STOP DANCE GIRL</title>
  <meta name="theme-color" content="#163a7a" />
  <meta name="description" content="Karakter menari looping tanpa henti, ala nyan.cat." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💃</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root { --sky:#163a7a; --ink:#061225; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body {
      height:100%; height:100dvh; background:var(--sky); color:#fff;
      font-family:"Press Start 2P", ui-monospace, Menlo, monospace;
      overflow:hidden; user-select:none; -webkit-user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    body {
      background:
        radial-gradient(900px 420px at 50% -8%, #2b5fb3 0%, transparent 62%),
        linear-gradient(180deg, #1a4a96 0%, var(--sky) 42%, #0b1c40 100%);
    }
    .top { position:relative; z-index:6; text-align:center; padding:max(12px, env(safe-area-inset-top)) 12px 6px; }
    h1 { font-size:clamp(12px,3vw,24px); letter-spacing:2px; line-height:1.55; text-shadow:3px 3px 0 var(--ink), 0 0 16px rgba(255,111,176,.4); }
    .sub { margin-top:8px; font-size:8px; letter-spacing:1.6px; opacity:.86; }
    .warn { display:inline-block; margin-top:10px; background:#0b1e3d; border:3px solid var(--ink); padding:7px 10px; font-size:7px; letter-spacing:.8px; color:#d6e6ff; line-height:1.7; }
    .stage-wrap { width:min(980px, calc(100vw - 24px)); margin:10px auto 0; }
    .stage { position:relative; height:min(48vh,400px); border:6px solid var(--ink); border-radius:8px; overflow:hidden; background:#1c4ea0; box-shadow:0 10px 0 #04101f, 0 16px 36px rgba(0,0,0,.32); }
    #space { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .flyer { position:absolute; left:62%; top:52%; width:min(240px,40vw); height:min(260px,36vh); transform:translate(-50%,-50%); z-index:4; pointer-events:none; }
    .flyer img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; filter:drop-shadow(0 10px 0 rgba(0,0,0,.16)); }
    .flyer img.on { opacity:1; }
    .hud { position:relative; z-index:6; display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:14px; padding:0 12px max(20px, env(safe-area-inset-bottom)); }
    .controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
    button { font-family:inherit; font-size:8px; letter-spacing:.8px; color:#10203a; background:#f3f6ff; border:3px solid var(--ink); padding:10px 12px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
    button:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
    button.on { background:#b8ffd2; }
    button.hot { background:#ffd1e8; }
    .score { text-align:center; line-height:1.9; font-size:8px; }
    .score .num { display:block; font-size:clamp(18px,6vw,28px); color:#ffe38a; text-shadow:2px 2px 0 var(--ink); }
    .best { opacity:.8; font-size:7px; letter-spacing:1px; }
    .achieve { min-height:28px; font-size:8px; color:#ffd1e8; text-align:center; max-width:640px; line-height:1.7; }
    footer { text-align:center; font-size:7px; opacity:.5; }
    .tap-gate { position:fixed; inset:0; z-index:30; background:rgba(8,18,40,.78); display:grid; place-items:center; padding:24px; cursor:pointer; }
    .tap-gate.gone { display:none; }
    .tap-card { background:#163a7a; border:6px solid var(--ink); padding:28px 20px; max-width:420px; text-align:center; box-shadow:8px 8px 0 var(--ink); }
    .tap-card h2 { font-size:13px; line-height:1.7; margin-bottom:14px; }
    .tap-card p { font-size:8px; line-height:1.9; opacity:.92; }
    @media (max-width:640px) { .stage{height:42vh;} .flyer{width:58vw;height:36vh;} }
  </style>
</head>
<body>
  <div class="tap-gate" id="gate">
    <div class="tap-card">
      <h2>NON-STOP<br>DANCE GIRL</h2>
      <p>Ketuk untuk mulai.<br>Tarian + musik looping tanpa henti.</p>
    </div>
  </div>
  <header class="top">
    <h1>NON-STOP DANCE GIRL</h1>
    <div class="sub">ALA NYAN.CAT · NARI TERUS</div>
    <div class="warn">JANGAN TUTUP TAB. SKOR SESI HILANG KALAU DITUTUP.</div>
  </header>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="space"></canvas>
      <div class="flyer" id="flyer">
        <img alt="" data-i="0" data-frame="shrug" />
        <img alt="" data-i="1" data-frame="dance" />
        <img alt="" data-i="2" data-frame="yes" />
      </div>
    </div>
  </div>
  <div class="hud">
    <div class="controls">
      <button id="btnMusic" class="on" type="button">MUSIK: ON</button>
      <button id="btnSpeed" type="button">TEMPO: NORMAL</button>
      <button id="btnTrail" class="hot" type="button">JEJAK: PELANGI</button>
      <button id="btnFull" type="button">LAYAR PENUH</button>
    </div>
    <div class="score">
      KAMU SUDAH NARI SELAMA
      <span class="num" id="seconds">0.0</span>
      DETIK
      <div class="best" id="best">REKOR: 0.0 DETIK</div>
    </div>
    <div class="achieve" id="achieve">memuat frame...</div>
    <footer>fan page · looping forever · 2026</footer>
  </div>
  <script>
    const frames = [...document.querySelectorAll("#flyer img")];
    const flyer = document.getElementById("flyer");
    const stage = document.getElementById("stage");
    const secondsEl = document.getElementById("seconds");
    const bestEl = document.getElementById("best");
    const achieveEl = document.getElementById("achieve");
    const gate = document.getElementById("gate");
    const btnMusic = document.getElementById("btnMusic");
    const btnSpeed = document.getElementById("btnSpeed");
    const btnTrail = document.getElementById("btnTrail");
    const btnFull = document.getElementById("btnFull");
    const canvas = document.getElementById("space");
    const ctx = canvas.getContext("2d");

    const sequence = [1, 2, 0, 1, 2, 1];
    let seqIndex = 0, frameMs = 210, startedAt = 0, accumulated = 0;
    let running = false, musicOn = true, trailMode = 0, assetsReady = false;
    const speeds = [
      { label: "PELAN", ms: 340 },
      { label: "NORMAL", ms: 210 },
      { label: "CEPAT", ms: 130 },
      { label: "GILA", ms: 70 }
    ];
    let speedIdx = 1;
    const BEST_KEY = "dance-girl-best";
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    const milestones = [
      [5, "5 DETIK. PEMANASAN."],
      [10, "10 DETIK. KAKI MULAI GATAL."],
      [30, "30 DETIK. INI SUDAH NARI BENERAN."],
      [60, "1 MENIT. JANGAN BERHENTI."],
      [120, "2 MENIT. DIA MASIH SEMANGAT."],
      [180, "3 MENIT. KAMU JUGA MASIH DI SINI?"],
      [300, "5 MENIT. PRESTASI YANG ANEH TAPI NYATA."],
      [600, "10 MENIT. INI SUDAH MEDITASI."],
      [900, "15 MENIT. RESPECT."],
      [1800, "30 MENIT. KAMU PEJUANG TAB."],
      [3600, "1 JAM. NON-STOP SEJATI."]
    ];
    const unlocked = new Set();

    function showFrame(i) { frames.forEach((img, idx) => img.classList.toggle("on", idx === i)); }
    showFrame(1);
    function renderBest(v) { bestEl.textContent = "REKOR: " + v.toFixed(1) + " DETIK"; }
    renderBest(best);
    function currentSec() { return running ? accumulated + (Date.now() - startedAt) / 1000 : accumulated; }

    Promise.all(frames.map(async (img) => {
      const name = img.getAttribute("data-frame");
      const b64 = await fetch("img/" + name + ".b64").then((r) => r.text());
      img.src = "data:image/webp;base64," + b64.trim();
    })).then(() => {
      assetsReady = true;
      achieveEl.textContent = "ketuk layar untuk mulai menari";
    }).catch(() => {
      achieveEl.textContent = "gagal memuat gambar";
    });

    let stars = [], trail = [], cssW = 1, cssH = 1;
    function resize() {
      const r = canvas.getBoundingClientRect();
      cssW = r.width; cssH = r.height;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.floor(cssW * dpr);
      canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: 56 }, () => ({
        x: Math.random() * cssW, y: Math.random() * cssH,
        s: Math.random() < 0.72 ? 2 : 3, tw: Math.random() * Math.PI * 2,
        sp: 0.55 + Math.random() * 1.6, kind: Math.random() < 0.2 ? "plus" : "dot"
      }));
    }
    window.addEventListener("resize", resize);
    resize();
    const rainbow = ["#ff3b3b", "#ff9a2f", "#ffe44a", "#4ade80", "#38bdf8", "#a78bfa"];
    const pinks = ["#fff7fb", "#ffd1e8", "#ff6fb0", "#ff3d8a", "#c81e6a", "#fff7fb"];
    function draw() {
      ctx.clearRect(0, 0, cssW, cssH);
      for (const st of stars) {
        st.x -= st.sp; st.tw += 0.09;
        if (st.x < -8) { st.x = cssW + 8; st.y = Math.random() * cssH; }
        const a = 0.4 + Math.sin(st.tw) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        if (st.kind === "plus") { ctx.fillRect(st.x - 3, st.y, 7, 2); ctx.fillRect(st.x, st.y - 3, 2, 7); }
        else ctx.fillRect(st.x, st.y, st.s, st.s);
      }
      if (trailMode !== 2 && trail.length > 1) {
        const colors = trailMode === 1 ? pinks : rainbow;
        const band = 11;
        for (let s = 0; s < colors.length; s++) {
          ctx.beginPath();
          ctx.strokeStyle = colors[s];
          ctx.lineWidth = band;
          const offset = (s - (colors.length - 1) / 2) * band;
          for (let i = 0; i < trail.length; i++) {
            const p = trail[i];
            const wave = Math.sin(p.t + s * 0.4) * 3;
            if (i === 0) ctx.moveTo(p.x, p.y + offset + wave);
            else ctx.lineTo(p.x, p.y + offset + wave);
          }
          ctx.stroke();
        }
      }
      requestAnimationFrame(draw);
    }
    draw();

    function flyerCenter() {
      const s = stage.getBoundingClientRect();
      const f = flyer.getBoundingClientRect();
      return { x: f.left - s.left + f.width * 0.18, y: f.top - s.top + f.height * 0.48, t: performance.now() / 140 };
    }
    function tickDance() {
      if (!running) return;
      seqIndex = (seqIndex + 1) % sequence.length;
      showFrame(sequence[seqIndex]);
      setTimeout(tickDance, frameMs);
    }
    function tickMove() {
      if (!running) return;
      const t = currentSec();
      const bob = Math.sin(t * 5.2) * 10;
      const xCycle = (t * 22) % 118;
      const x = 36 + (xCycle < 59 ? xCycle * 0.45 : (118 - xCycle) * 0.45);
      flyer.style.left = x + "%";
      flyer.style.top = `calc(52% + ${bob}px)`;
      flyer.style.transform = `translate(-50%, -50%) rotate(${Math.sin(t * 3) * 3}deg)`;
      trail.push(flyerCenter());
      if (trail.length > 42) trail.shift();
      requestAnimationFrame(tickMove);
    }
    function tickScore() {
      if (!running) return;
      const sec = currentSec();
      secondsEl.textContent = sec.toFixed(1);
      if (sec > best) { best = sec; localStorage.setItem(BEST_KEY, String(best)); renderBest(best); }
      for (const [at, msg] of milestones) {
        if (sec >= at && !unlocked.has(at)) { unlocked.add(at); achieveEl.textContent = msg; }
      }
      requestAnimationFrame(tickScore);
    }

    let audioCtx, master, playing = false, loopTimer = null;
    function note(freq, time, dur, type, gain) {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(gain, time + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g); g.connect(master); o.start(time); o.stop(time + dur + 0.02);
    }
    function kick(time) {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(150, time);
      o.frequency.exponentialRampToValueAtTime(42, time + 0.14);
      g.gain.setValueAtTime(0.38, time); g.gain.exponentialRampToValueAtTime(0.0001, time + 0.16);
      o.connect(g); g.connect(master); o.start(time); o.stop(time + 0.18);
    }
    function hat(time) {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = "square"; o.frequency.value = 6800;
      g.gain.setValueAtTime(0.03, time); g.gain.exponentialRampToValueAtTime(0.0001, time + 0.045);
      o.connect(g); g.connect(master); o.start(time); o.stop(time + 0.05);
    }
    const lead = [523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 392.00];
    const bass = [130.81, 130.81, 196.00, 174.61, 146.83, 146.83, 174.61, 196.00];
    function scheduleLoop(start) {
      const beat = 0.21;
      for (let bar = 0; bar < 4; bar++) {
        for (let i = 0; i < 8; i++) {
          const t = start + (bar * 8 + i) * beat;
          if (i % 2 === 0) kick(t);
          hat(t);
          if (i % 2 === 0) hat(t + beat * 0.5);
          note(lead[(i + bar) % lead.length], t, beat * 0.82, "square", 0.065);
          note(bass[i], t, beat * 1.02, "triangle", 0.075);
        }
      }
      return beat * 32;
    }
    function startMusic() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!master) { master = audioCtx.createGain(); master.gain.value = 0.5; master.connect(audioCtx.destination); }
      playing = true;
      const pass = () => {
        if (!playing || !musicOn) return;
        const len = scheduleLoop(audioCtx.currentTime + 0.04);
        loopTimer = setTimeout(pass, len * 1000 - 30);
      };
      pass();
    }
    function stopMusic() { playing = false; if (loopTimer) clearTimeout(loopTimer); }

    function startAll() {
      if (running || !assetsReady) return;
      running = true; startedAt = Date.now();
      gate.classList.add("gone");
      achieveEl.textContent = "mulai menari...";
      tickDance(); tickMove(); tickScore();
      if (musicOn) startMusic();
    }
    gate.addEventListener("click", startAll);
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); startAll(); }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && running) { accumulated = currentSec(); running = false; stopMusic(); }
      else if (!document.hidden && accumulated > 0 && !running) {
        running = true; startedAt = Date.now();
        tickDance(); tickMove(); tickScore();
        if (musicOn) startMusic();
      }
    });
    btnMusic.addEventListener("click", () => {
      musicOn = !musicOn;
      btnMusic.textContent = "MUSIK: " + (musicOn ? "ON" : "OFF");
      btnMusic.classList.toggle("on", musicOn);
      if (!running) return;
      if (musicOn) startMusic(); else stopMusic();
    });
    btnSpeed.addEventListener("click", () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      frameMs = speeds[speedIdx].ms;
      btnSpeed.textContent = "TEMPO: " + speeds[speedIdx].label;
    });
    btnTrail.addEventListener("click", () => {
      trailMode = (trailMode + 1) % 3;
      btnTrail.textContent = "JEJAK: " + ["PELANGI", "PINK", "OFF"][trailMode];
    });
    btnFull.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement && stage.requestFullscreen) await stage.requestFullscreen();
        else if (document.exitFullscreen) await document.exitFullscreen();
      } catch (_) {}
    });
  </script>
</body>
</html>
